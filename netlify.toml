# Pin the Hugo version so Netlify builds exactly what you build locally.
# Settings here override the build settings in the Netlify UI.
[build]
  command = "hugo --gc --minify"
  publish = "public"

[build.environment]
  HUGO_VERSION = "0.152.2"

[[headers]]
  for = "*.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json; charset=UTF-8"
